name: Canary

# Each week, runs the tests against the Core's `develop`, so a change of the
# Core that breaks this plugin shows before the Core releases it (home
# ADR-0003). Not a required check. When the tests fail, it opens one issue,
# or comments on the one that is still open.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    name: Tests against Core develop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Clone the Core's develop
        run: git clone --quiet --depth 1 --branch develop https://github.com/a1exk-dev/codestyle.nvim.git "$RUNNER_TEMP/core"

      - name: Run tests
        env:
          CODESTYLE_CORE_DIR: ${{ runner.temp }}/core
        run: nvim --headless -l test/run.lua

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: the tests fail against the Core's develop"
          body="The weekly canary run failed: $RUN_URL"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ -n $number ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
